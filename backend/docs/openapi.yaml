"openapi": "3.0.3"
"info":
  "title": "Forma Milestone 3 API"
  "version": "1.0.0"
  "description": "Local educational API. No authentication or authorization until M4: 401/403 are reserved for that milestone. All request bodies are JSON objects; unknown fields and empty objects are rejected. PUT accepts a nonempty partial update and preserves omitted fields. Numeric strings are also accepted by validation; use JSON numbers. Dates must be real YYYY-MM-DD dates between 1000-01-01 and 9999-12-31. Plans linked to workout history cannot be transferred to another user. DELETE follows the original schema: user cascades owned records, plan cascades assignments and detaches sessions, session cascades logs, referenced exercises cannot be deleted. Do not expose this unauthenticated API publicly."
"servers":
  - 
    "url": ".."
    "description": "Same backend as this specification (XAMPP or PHP development server)"
"tags":
  - 
    "name": "users"
  - 
    "name": "exercises"
  - 
    "name": "workout-plans"
  - 
    "name": "plan-exercises"
  - 
    "name": "workout-sessions"
  - 
    "name": "exercise-logs"
  - 
    "name": "meals"
